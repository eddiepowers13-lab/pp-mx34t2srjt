<title>Prehab & Rehab</title>
<style>
:root{--bg:#0b0f14;--bg2:#0f151c;--card:#141c25;--card2:#1a2430;--line:#243242;--tx:#e8eef5;--mu:#8fa0b2;--ac:#3ddc97;--ac2:#5b8cff;--am:#ffb454;--rd:#ff6b6b;--pu:#b388ff;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif}
body{padding-bottom:84px}
h1,h2,h3,h4{margin:0;line-height:1.2}h2{font-size:18px;margin-bottom:10px}h3{font-size:15px;margin-bottom:8px}
a{color:var(--ac2)}
header.top{position:sticky;top:0;z-index:30;background:rgba(11,15,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px;flex:1;min-width:160px}
.brand small{display:block;font-weight:500;color:var(--mu);font-size:11.5px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(15,21,28,.97);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;min-width:58px;background:none;border:0;color:var(--mu);padding:6px 6px;border-radius:10px;font-weight:600;font-size:11px;line-height:1.1;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav.tabs button span{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--ac);background:rgba(61,220,151,.1)}
nav.tabs button .dot{position:absolute;top:3px;right:12px;width:9px;height:9px;border-radius:9px;background:var(--rd);display:none}
nav.tabs button .dot.show{display:block}
main{max-width:1000px;margin:0 auto;padding:14px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat .l{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.stat .v{font-size:26px;font-weight:800;margin-top:2px;letter-spacing:-.5px}
.stat .v small{font-size:13px;color:var(--mu);font-weight:600;margin-left:3px}
.stat .s{color:var(--mu);font-size:12px;margin-top:2px}
.pos{color:var(--ac)}.neg{color:var(--rd)}.warn{color:var(--am)}.mut{color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.btn{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;min-height:40px}
.btn.primary{background:var(--ac);color:#04140c;border-color:var(--ac)}
.btn.danger{color:var(--rd);border-color:#4a2a30}
.btn.sm{padding:5px 9px;min-height:30px;font-size:12.5px;border-radius:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu);font-weight:600;min-width:0}
input,select,textarea{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;font-family:inherit;min-height:40px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid rgba(91,140,255,.55);border-color:var(--ac2)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--rd);padding:0;flex:0 0 auto}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.form .wide{grid-column:1/-1}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--card2);color:var(--mu);border:1px solid var(--line)}
.pill.ok{color:var(--ac);background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.3)}
.pill.warn{color:var(--am);background:rgba(255,180,84,.12);border-color:rgba(255,180,84,.3)}
.pill.bad{color:var(--rd);background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.3)}
.pill.blue{color:var(--ac2);background:rgba(91,140,255,.12);border-color:rgba(91,140,255,.3)}
.note{font-size:12.5px;color:var(--mu)}
.banner{border:1px solid rgba(255,180,84,.35);background:rgba(255,180,84,.08);color:#ffd9a3;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.banner.info{border-color:rgba(91,140,255,.35);background:rgba(91,140,255,.08);color:#c6d6ff}
.banner.red{border-color:rgba(255,107,107,.6);background:rgba(255,107,107,.13);color:#ffd0d0}
.banner.red b.big{display:block;font-size:17px;color:#fff;margin-bottom:4px}
.banner.ok{border-color:rgba(61,220,151,.35);background:rgba(61,220,151,.08);color:#bff3da}
.bar{height:8px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:9px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;background:none;border:0;color:var(--mu);padding:6px 9px;border-radius:8px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;min-height:34px}
.seg button.on{background:var(--card2);color:var(--tx)}
.seg button.today{box-shadow:inset 0 -2px 0 var(--ac)}
.day{border-left:4px solid var(--ac2)}
.day ul{list-style:none;margin:8px 0 0;padding:0}
.day li{padding:7px 0;border-bottom:1px dashed #1f2c3a;font-size:14px}
.day li .rx{color:var(--ac);font-weight:700;white-space:nowrap}.day li.cardio .rx{white-space:normal;text-align:right;max-width:58%}
.day li .cue{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
.day li.core .nm::before{content:"◎ ";color:var(--pu)}
.day li.cardio .nm::before{content:"♥ ";color:var(--rd)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.ex h4{font-size:15.5px}
.srow{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:8px;align-items:center;margin-top:8px}
.srow .sn{color:var(--mu);font-weight:700;text-align:center}
.srow .btn{padding:0;height:40px}
.srow.logged input{opacity:.6}.srow.logged .btn{background:var(--ac);color:#04140c;border-color:var(--ac)}
.sug{font-size:12.5px;margin-top:6px;color:var(--mu)}.sug b{color:var(--ac)}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#1d2b3a;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:80;font-weight:600;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12.5px;color:var(--mu)}
.cd{display:flex;align-items:baseline;gap:6px}.cd .n{font-size:46px;font-weight:900;letter-spacing:-1.5px;line-height:1}
.tl{position:relative;margin-left:8px;padding-left:20px;border-left:2px solid var(--line)}
.tl .it{position:relative;padding:0 0 16px}
.tl .it::before{content:"";position:absolute;left:-28px;top:3px;width:14px;height:14px;border-radius:14px;background:var(--card2);border:2px solid var(--line)}
.tl .it.past::before{background:var(--ac2);border-color:var(--ac2)}
.tl .it.now::before{background:var(--ac);border-color:var(--ac);box-shadow:0 0 0 4px rgba(61,220,151,.2)}
.tl .it.surg::before{background:var(--rd);border-color:var(--rd)}
.tl .it h4{font-size:15px}.tl .it .d{font-size:12px;color:var(--mu);font-weight:600;margin:2px 0 4px}
.tl .it ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
details{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
details summary{cursor:pointer;font-weight:700}
details ul{padding-left:18px;margin:8px 0 2px;font-size:13.5px}details li{margin-bottom:4px}
.cbx{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #1f2c3a;font-size:14px;cursor:pointer}
.cbx small{display:block;color:var(--mu);font-size:12px}
.hist{font-size:13px;border-bottom:1px solid var(--line);padding:8px 0}
.hist:last-child{border-bottom:0}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 7px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mu);font-size:11px;text-transform:uppercase}td.num{text-align:right;font-variant-numeric:tabular-nums}
.disc{font-size:12px;color:var(--mu);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 14px}
@media(max-width:760px){.g3{grid-template-columns:repeat(2,1fr)}.stat .v{font-size:23px}main{padding:10px}.card{padding:12px}}
@media(min-width:900px){nav.tabs{position:sticky;top:57px;bottom:auto;max-width:1000px;margin:0 auto;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}body{padding-bottom:20px}nav.tabs button{flex-direction:row;font-size:13px;gap:6px}nav.tabs button span{font-size:16px}}
</style>
</head>
<body>
<header class="top">
 <div class="brand">Hernia Prehab &amp; Rehab<small>Inguinal hernia · build chest &amp; arms · lose fat · protect the repair</small></div>
 <span id="syncpill" class="pill">☁︎</span>
 <button class="btn sm" data-go="timeline">⚙︎ Settings</button>
</header>
<nav class="tabs" id="tabs">
 <button data-t="home" class="on"><span>🏠</span>Home</button>
 <button data-t="program"><span>📋</span>Program</button>
 <button data-t="log"><span>🏋️</span>Log</button>
 <button data-t="check"><span>🩺</span>Check-in<i class="dot" id="ckdot"></i></button>
 <button data-t="food"><span>🥩</span>Nutrition</button>
 <button data-t="timeline"><span>🗓️</span>Timeline</button>
</nav>
<main>
 <section class="tab on" id="t-home"></section>
 <section class="tab" id="t-program"></section>
 <section class="tab" id="t-log"></section>
 <section class="tab" id="t-check"></section>
 <section class="tab" id="t-food"></section>
 <section class="tab" id="t-timeline"></section>
</main>
<div id="toast"></div>
<script>
/* ================= state ================= */
const KEY='hpr-dash-v1';
const DEF={surgery:'2026-12-14',start:'2026-11-18',repair:'robolap',liftCap:10,v:2,
 targets:{kcalCut:2400,kcalMaint:2850,protein:190,fiber:35,water:120,steps:10000},
 log:[],checks:{},food:{},done:{},recov:{},sess:null,lastExport:null};
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){if(!s.v||s.v<2){if(s.liftCap==null||s.liftCap===15)s.liftCap=10;if(!s.repair||s.repair==='unknown'||s.repair==='lap')s.repair='robolap';s.v=2}}if(s)return Object.assign({},DEF,s,{targets:Object.assign({},DEF.targets,s.targets||{}),recov:s.recov||{}})}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(S))}
function save(){saveLocal();if(typeof queueSync==='function')queueSync()}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
/* ================= dates (UTC day numbers, DST-proof) ================= */
const dn=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const ds=n=>new Date(n*864e5).toISOString().slice(0,10);
const urlToday=new URLSearchParams(location.search).get('today');
function todayStr(){if(urlToday&&/^\d{4}-\d{2}-\d{2}$/.test(urlToday))return urlToday;const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const TD=()=>dn(todayStr());
const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const dowOf=n=>DOW[new Date(n*864e5).getUTCDay()];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=n=>{const d=new Date(n*864e5);return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()]+' '+MON[d.getUTCMonth()]+' '+d.getUTCDate()};
const fmtS=n=>{const d=new Date(n*864e5);return MON[d.getUTCMonth()]+' '+d.getUTCDate()};
const SD=()=>dn(S.surgery);
const CAPL=' (your number, confirm with surgeon)';
const REPAIR={robolap:'Robotic-assisted laparoscopic',open:'Open',unknown:'Not confirmed'};

/* ================= program content ================= */
const X=(name,sets,reps,cue,kind)=>({name,sets,reps,cue:cue||'',kind:kind||'lift'});
const C=(name,sets,reps,cue)=>X(name,sets,reps,cue,'core');
const K=(name,reps,cue)=>X(name,1,reps,cue,'cardio');
const BREATH='Exhale through the hard part of every rep. No breath-holding, no straining, no grinding reps.';
const PLATE='Load plates one at a time: plate close to the body, hinge or squat with a long spine, neutral exhale as you lift. Never bend over and strain. Strip it the same way.';
const HS=c=>c+' Plate-loaded: load carefully (see the plate rule).';
const DIPCUE='Bodyweight or assisted only, never belt-weighted. Exhale on the way up, ribs down, don\'t bear down. Progression: assisted dip machine (or band) → less assistance each time you hit 12 on every set → slow negatives → full bodyweight reps. Log assistance as a negative number (e.g. -60) and bodyweight as 0.';
const PUCUE='Bodyweight or assisted only, never belt-weighted. Dead-hang start, exhale as you pull, ribs down, no kipping, don\'t bear down. Progression: assisted pull-up machine (or band) → less assistance each time you hit 10 on every set → slow negatives → full bodyweight reps. Log assistance as a negative number (e.g. -70) and bodyweight as 0.';
const BW=o=>Object.assign(o,{bw:1});
const L=o=>Object.assign(o,{log:1});
const WDB=(sets,reps)=>L(C('Weighted dead bug',sets,reps||'8 / side','Hold a light plate or a 10–15 lb kettlebell over your chest. Exhale as you reach, low back flat on the floor. Drop the weight (or go unweighted) if your belly domes or you feel groin pressure.'));
const SUIT=(sets)=>L(C('Suitcase carry',sets,'30–40 yd / side','About 45–55 lb KB or DB in one hand (down from the 80 lb you were using; build back past 80 lb after week 6). Pick it up from a bench or rack, NEVER off the floor. Walk tall, don\'t lean, breathe steadily (no breath-holding). Set it back on the bench.'));
const LMAR=(sets)=>L(C('Landmine anti-rotation press',sets,'8 / side','Half-kneeling or tall stance, moderate load. Press the bar out and hold 2 s; don\'t let it pull you around. Exhale on the press. Load plates carefully.'));
const LMROT=(sets)=>L(C('Landmine controlled rotation',sets,'6–8 / side','Moderate load, arms long. Slow 3 s arc side to side, hips and ribs turn together. Nothing fast or explosive. Exhale through the turn.'));
const PRE={
 MON:{title:'Chest & Triceps · priority A',min:'60–70 min',items:[
  K('Warm-up','5 min bike + 5 slow 90/90 breaths','Band pull-aparts ×15. Take your inhaler first if your plan calls for it.'),
  X('Hammer Strength Incline Press',4,'8–12',HS('Main chest lift. Exhale as you press. Stop 1–2 reps before failure.')),
  X('Hammer Strength Chest Press',3,'8–12',HS('Back on the pad. 2 s down, press up while exhaling.')),
  BW(X('Dips (bodyweight / assisted)',3,'6–12',DIPCUE)),
  X('Low-to-high cable fly',3,'12–15','Upper chest. Squeeze for 1 s at the top.'),
  X('Pec deck',2,'12–15','Last set: optional drop set (pin down ~30% and go again).'),
  X('Seated overhead cable triceps extension',3,'10–15','Long head of the triceps. Sit with back support.'),
  X('Rope pushdown',3,'12–15','Elbows pinned. Breathe out as you push down.'),
  WDB(3),
  C('Pallof press',3,'10 / side','Resist rotation. Breathe normally the whole set.')]},
 TUE:{title:'Back & Biceps · deep core',min:'60–70 min',items:[
  K('Warm-up','5 min row or bike','Band pull-aparts, scap pulls, 2 easy assisted pull-up sets.'),
  BW(X('Pull-ups (bodyweight / assisted)',3,'5–10',PUCUE)),
  X('Hammer Strength Pulldown',3,'8–12',HS('Pull to the upper chest while exhaling.')),
  X('Hammer Strength Iso-Lateral Row',3,'8–12',HS('Chest on the pad takes load off the trunk.')),
  X('V-bar cable pulldown',3,'10–12','Close neutral grip. Lean back slightly, pull the V-bar to the upper chest, elbows to the ribs, exhale as you pull. Ribs down, no heaving.'),
  X('Hammer Strength High Row',2,'10–12',HS('Elbows down and back, squeeze lats/mid-back.')),
  X('Reverse pec deck',3,'12–15','Rear delts for shoulder balance.'),
  X('Machine preacher curl',3,'10–15','Arm priority. Control the lowering.'),
  X('Cable curl (straight bar)',2,'10–12','Full stretch at the bottom, no swinging.'),
  X('Cable rope hammer curl',2,'12–15','Brachialis and forearms.'),
  LMROT(2),
  C('Side plank',3,'20–30 s / side','Start from the knees, then progress to full. Keep breathing; don\'t bear down.')]},
 WED:{title:'Legs, hernia-smart · Zone 2',min:'55–65 min',items:[
  K('Warm-up','5 min bike','Leg swings, bodyweight box squats to a high box.'),
  X('Leg press',3,'12–15',HS('Moderate load only. Stop before your hips tuck under. Exhale on the way up. No max sets and no holding your breath at lockout.')),
  X('Leg extension',3,'12–15','Quads with almost no trunk demand.'),
  X('Seated leg curl',3,'10–15','Hamstrings. Hips stay down.'),
  X('Supported split squat (bodyweight)',2,'10 / leg','Hold a rack. Bodyweight only, no dumbbells to carry. Skip it if your groin pulls.'),
  X('Hip abduction machine',3,'12–15','Glutes. (Skip heavy adductor and Copenhagen work for now.)'),
  X('Seated calf raise machine',3,'12–20','Pause in the stretch.'),
  K('Zone 2: incline walk or bike','20–30 min','Pace where you can still talk. Nasal breathing if you can.'),
  K('Core circuit','2–3 rounds, ~10–12 min','Do the four moves back to back, then the 1-minute breathing reset, then repeat. Smooth and controlled, never rushed.'),
  WDB(1,'8 / side · per round'),
  Object.assign(SUIT(1),{reps:'30–40 yd / side · per round'}),
  Object.assign(LMAR(1),{reps:'8 / side · per round'}),
  C('Side plank',1,'20–30 s / side · per round','Knees or full.'),
  C('Breathing reset: 90/90 + TA exhale',1,'1 min between rounds','Lie on your back with feet on a bench. Long exhale until your lower belly gently draws in.')]},
 THU:{title:'Shoulders & Arms · priority B',min:'55–65 min',items:[
  K('Warm-up','5 min bike','Band external rotations ×15/side.'),
  X('Hammer Strength Shoulder Press',3,'8–12',HS('Seated, back supported. No heavy standing overhead pressing for now.')),
  X('Machine lateral raise',4,'12–20','Delt width. Pin-loaded machine, pause at the top.'),
  X('Cable lateral raise',2,'15–20','Single arm, behind-the-body start.'),
  X('Face pull',3,'12–15','External rotation at the top.'),
  X('Cable bayesian curl',3,'12–15','Long-head stretch.'),
  X('Single-arm cable triceps extension',3,'12–15','Each arm.'),
  X('Cable EZ-bar curl',2,'10–12','Cable instead of a free bar, so nothing to pick up.'),
  X('Seated dip machine',2,'10–15','Triceps. Selectorized seated machine, back on the pad.'),
  C('Pallof press, half-kneeling',3,'10 / side','Glute of the down knee squeezed.'),
  C('Dead bug with band pull-down',2,'8 / side','Band overhead adds anti-extension. Exhale as you reach.')]},
 FRI:{title:'Upper B · chest, back & arms · intervals',min:'60–70 min',items:[
  K('Warm-up','5 min bike','Push-ups to a bench ×10.'),
  X('Hammer Strength Iso-Lateral Chest Press',3,'8–12',HS('One arm at a time or both. Leave 2 reps in the tank. No singles or max attempts.')),
  BW(X('Dips (bodyweight / assisted)',2,'6–12',DIPCUE)),
  X('Incline cable fly',3,'12–15','Stretch focus.'),
  BW(X('Pull-ups (bodyweight / assisted)',2,'5–10',PUCUE)),
  X('Single-arm cable row',2,'10–12 / side','Tall posture.'),

function phaseOn(n){const st0=dn(S.start)-((new Date(dn(S.start)*864e5).getUTCDay()+6)%7);if(n<st0)return{id:'pre0',name:'Starts '+fmtS(dn(S.start)),short:'Soon',from:n,to:dn(S.start)-1,focus:'Program starts soon.',bullets:[]};const P=phases();for(const p of P)if(n>=p.from&&n<=p.to)return p;return Object.assign({},P[P.length-1],{id:'long',name:'Long-term · full training',short:'Long-term'})}

function rirFor(n){const p=phaseOn(n);if(p.id==='build'){const w=weekOfBuild(n);return w<=1?'RIR 3':w===2?'RIR 2':'RIR 1–2'}if(p.id==='peak')return'RIR 2';if(p.id==='taper')return'RIR 4 · taper';if(p.id==='r2')return n-SD()<35?'RIR 4':'RIR 3';if(p.id==='r3'||p.id==='long')return n-SD()<49?'RIR 3':'RIR 2';return'—'}

 if(p.id==='r0')return Object.assign(cp(R0),{phase:p});

  s.title='Taper · '+s.title;s.note=TAPER_NOTE;s.items=s.items.filter(i=>!/Leg press|split squat|Bike intervals|abduction|calf|Zone 2|Suitcase|Landmine|Core circuit/i.test(i.name)).map(i=>i.kind==='lift'?Object.assign(i,{sets:Math.max(1,Math.ceil(i.sets/2))}):i)}

/* ================= red-flag logic ================= */
const BULGE=['None','Appears with effort, goes back on its own','Stays out but pushes back in when I lie down','Out and WON\'T go back in'];
function evalCheck(c,n){const red=[],amber=[];if(!c)return{red,amber,level:'none'};const post=n>=SD();
 const b=+c.bulge||0,pain=c.pain==null?null:+c.pain,fev=c.temp!=null&&c.temp!==''&&+c.temp>=100.4;
 if(!post){
  if(b===3)red.push('Hernia bulge won\'t go back in (possible incarceration)');
  if(c.firm)red.push('Bulge is firm, hard, or very tender');
  if(c.color)red.push('Skin over the bulge is red, purple, or dark (possible strangulation)');
  if(c.severe)red.push('Sudden severe groin pain');
  if(c.vomit&&(b>0||(pain||0)>=4))red.push('Nausea/vomiting with groin pain or bulge');
  if(c.noGas)red.push('Can\'t pass gas or stool');
  if(fev&&(b>0||(pain||0)>=4))red.push('Fever with groin pain');
  if(b===2)amber.push('Bulge stays out until you lie down. Tell your surgeon\'s office this week and drop leg-day loads');
  if(b===1)amber.push('Bulge with effort. Lighten that exercise and focus on exhaling');
  if(c.bigger)amber.push('Bulge is bigger than usual. Call your surgeon\'s office');
 }else{
  if(fev&&+c.temp>=101)red.push('Fever ≥101°F after surgery');
  if(c.wound)red.push('Incision has spreading redness, pus, opening, or bleeding through the dressing');
  if(c.noPee)red.push('Can\'t urinate / very little urine (urinary retention)');
  if(c.calf)red.push('Calf pain or swelling (possible clot)');
  if(c.chest)red.push('Chest pain or shortness of breath not relieved by your inhaler');
  if(c.vomit)red.push('Persistent vomiting');
  if(c.severe)red.push('Severe or worsening pain not controlled by your meds');
  if(b===3||c.firm)red.push('New hard bulge at the repair site');
  if(fev&&+c.temp<101)amber.push('Low-grade fever. Recheck in a few hours and call if it rises');
  if(c.scrotal)amber.push('Scrotal or groin swelling/bruising increasing. Call the surgeon\'s office (some is normal early)');
  if(c.noGas)amber.push('No bowel movement / can\'t pass gas. Call your surgeon if it\'s been more than 3 days or you\'re bloated');
  if(b===1||b===2)amber.push('A bulge or lump at the repair. Could be normal swelling (seroma), but mention it to your surgeon');
 }
 if(pain!=null&&pain>=7&&!red.length)red.push('Pain '+pain+'/10');
 else if(pain!=null&&pain>=4)amber.push('Pain '+pain+'/10. Skip or lighten anything that provokes it; if it lasts into the next day, go back one step');
 if(c.linger)amber.push('Pain lingering into the next day. Back off one step');
 if(c.strain)amber.push('Straining on the toilet. Add fiber and water; ask about a stool softener (straining loads the hernia/repair)');
 if(c.inhaler!=null&&c.inhaler!==''&&+c.inhaler>=3)amber.push('Rescue inhaler '+c.inhaler+'× today. Skip intervals and keep cardio easy; coughing fits load the groin');
 return{red,amber,level:red.length?'red':amber.length?'amber':'ok'}}
function latestCheck(){const ks=Object.keys(S.checks).sort();if(!ks.length)return null;const k=ks[ks.length-1];return{date:k,c:S.checks[k],e:evalCheck(S.checks[k],dn(k))}}

function guideCards(){return'<div class="card"><h2>Why it\'s built this way</h2>'+
 '<details open><summary>Breathing rule (the #1 thing)</summary><ul><li>'+BREATH+'</li><li>Brace lightly by exhaling and gently drawing the low belly in. Don\'t bear down or hold a big Valsalva breath. Breath-holding and max efforts produce the biggest pressure spikes inside the abdomen.</li><li>Leave 1–3 reps in reserve. Grinding reps automatically trigger breath-holding.</li><li><b>Plate rule:</b> '+PLATE+'</li></ul></details>'+
 '<details><summary>Dips &amp; pull-ups: rules and return date</summary><ul><li>Bodyweight or assisted only, never belt-weighted. Exhale through the effort and don\'t bear down.</li><li>Progression: assisted machine or band → reduce assistance when every set hits the top of the range → slow negatives → full bodyweight.</li><li><b>After surgery:</b> none in weeks 0–6. They put a heavy load on the core and on abdominal pressure (hanging and pressing your full bodyweight). Week 6+ = assisted only, 2 easy sets. Week 8+ = cut the assistance gradually if the repair feels normal the next day. This lines up with your surgeon\'s 6-week full-strength mark and the ~6-week heavy-lifting advice often given after open repair; your robotic lap repair may allow sooner, but only with surgeon OK.</li></ul></details>'+
 '<details><summary>What\'s avoided before surgery, and why</summary><ul><li><b>Heavy barbell squats, deadlifts, good mornings, and heavy standing overhead press:</b> high axial load plus a big brace means the largest pressure spikes in the abdomen.</li><li><b>Max singles, PR attempts, and belt-weighted dips/pull-ups:</b> force breath-holding. Dips and pull-ups stay in, but bodyweight or assisted only, with an exhale on every rep.</li><li><b>Picking up and carrying heavy dumbbells or barbells:</b> lifting from the floor and walking with load spikes pressure. Hammer Strength machines and cables replace them. '+PLATE+'</li><li><b>Sit-ups, crunches, hanging leg raises, V-ups, toes-to-bar, and ab-wheel rollouts:</b> high pressure plus strain on the lower abdominal wall.</li><li><b>Jumping, box jumps, sprints, heavy sled, tire flips:</b> impact and bracing spikes.</li><li><b>Kettlebell swings:</b> the fast hip snap with a hard brace creates sudden, repeated pressure spikes right at the groin.</li><li><b>Heavy carries (heavy farmer\'s walks, heavy suitcase carries):</b> they demand a long, maximal brace that turns into breath-holding. Carries stay light to moderate and are picked up from a bench, never the floor.</li><li><b>Fast or heavy rotation (med-ball throws, heavy landmine 180s, weighted Russian twists):</b> speed plus load means sharp pressure and shear across the lower abdominal wall. Landmine work stays slow, controlled and moderate.</li><li><b>Heavy adductor and Copenhagen work:</b> loads the groin right where the hernia is.</li><li>Your doctor gave no limits, and watchful-waiting research shows activity doesn\'t usually cause emergencies. But this gets you all the muscle-building stimulus with less provocation. If an exercise pops the bulge out, swap it.</li></ul></details>'+
 '<details><summary>Core plan: prevention, not six-pack work</summary><ul><li>Pre-op: learn the deep-core "exhale and draw-in" (transverse abdominis) and build anti-extension (weighted dead bug), anti-rotation (Pallof, landmine anti-rotation), controlled rotation (slow landmine arcs), and lateral strength (side plank, suitcase carry). These train the trunk without high pressure. No bird dogs.</li><li>Post-op: breathing and TA → heel slides and bridges → unweighted dead bugs → planks and Pallof → week 6+: weighted dead bugs, light suitcase carries and landmine → full lifting.</li><li>Long-term (3×/week, 10 min): weighted dead bug, Pallof or landmine anti-rotation, side plank, suitcase carry, and controlled landmine rotation. Plus keep body fat trending down, don\'t smoke, and keep asthma controlled. Chronic coughing and straining raise pressure on the repair.</li><li>Honest note: recurrence depends mostly on the repair itself and on tissue/collagen factors. Core training helps you control pressure and lift well; it isn\'t a guarantee.</li></ul></details>'+
 '<details><summary>Asthma-aware conditioning</summary><ul><li>Warm up gradually for 10–15 min before intervals. Use a pre-exercise inhaler only if your doctor prescribed one that way.</li><li>Seated bike intervals indoors (warm, humid air) instead of running or outdoor cold-air sprints.</li><li>Zone 2 with nasal breathing. Stop and use your rescue inhaler if you\'re wheezing.</li><li>Coughing fits load the groin, so log inhaler use in the check-in. 3 or more rescue uses in a day flags an easy day.</li></ul></details>'+
 '<details><summary>Progression &amp; missed days</summary><ul><li>Double progression: once every set hits the top of the range at the target RIR, add the smallest jump next time.</li><li>Missed a day (travel, holidays)? Shift the week. Don\'t double up. Hotel gym? Swap machines for DBs and cables with the same rep ranges.</li></ul></details>'+

 '<details><summary>Fat-loss &amp; healing playbook</summary><ul><li><b>Pre-op (now to ~Dec 8):</b> ~400–500 kcal under maintenance, aiming for about 0.5–1% of body weight per week. Protein ~190 g/day (1 g per lb of goal weight) split over 4 meals. Carbs around training.</li><li><b>Last 5 days pre-op and weeks 0–4:</b> eat at maintenance. Protein stays ~190 g. Healing needs energy and protein.</li><li><b>Fiber 30–38 g + water ~120 oz:</b> constipation is the enemy of a fresh repair. Appetite medications and opioid pain meds both slow the gut. Ask your surgeon about a stool softener.</li><li><b>Weeks 4–6:</b> small deficit; then back to the full fat-loss plan.</li><li>Limit alcohol around surgery; it impairs healing and sleep.</li></ul></details></div>'}
function spark(W){const w=340,h=110,xs=W.map(p=>p[0]),ys=W.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys)-1,y1=Math.max(...ys)+1;const X=x=>10+(x-x0)/((x1-x0)||1)*(w-20),Y=y=>h-10-(y-y0)/((y1-y0)||1)*(h-20);
 return'<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'"><polyline fill="none" stroke="#3ddc97" stroke-width="2.5" points="'+W.map(p=>X(p[0])+','+Y(p[1])).join(' ')+'"/>'+W.map(p=>'<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="3" fill="#5b8cff"/>').join('')+'<text x="10" y="12" fill="#8fa0b2" font-size="11">'+y1.toFixed(0)+'</text><text x="10" y="'+(h-1)+'" fill="#8fa0b2" font-size="11">'+y0.toFixed(0)+'</text></svg>'}

 $('#t-timeline').innerHTML=syncBox()+'<div class="card"><h2>Phase timeline</h2><div class="note" style="margin-bottom:4px"><b style="color:var(--tx)">Repair: '+REPAIR[S.repair]+' inguinal hernia repair</b></div><div class="note" style="margin-bottom:12px">Program start '+fmt(dn(S.start))+' → surgery '+fmt(s)+' → week 8 post-op '+fmt(s+56)+'</div><div class="tl">'+
 P.map(p=>{const st=n>p.to?'past':n>=p.from&&n<=p.to?'now':'';return'<div class="it '+st+(p.id==='surg'?' surg':'')+'"><h4>'+esc(p.name)+(st==='now'?' <span class="pill ok">now</span>':'')+'</h4><div class="d">'+(p.from===p.to?fmt(p.from):fmt(p.from)+' – '+fmt(p.to))+(p.from>=s&&p.id!=='surg'?' · post-op days '+(p.from-s)+'–'+(p.to-s):'')+'</div><div class="note">'+esc(p.focus)+'</div><ul>'+p.bullets.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul></div>'}).join('')+'</div>'+
 '<div class="banner info" style="margin:6px 0 0"><b>Your repair is robotic-assisted laparoscopic.</b> Laparoscopic/robotic repairs usually recover faster than open ones. Published advice often allows heavy lifting from about 2 weeks after lap repair, versus up to about 6 weeks after open, and international guidelines say normal activity can resume once comfortable. This plan still follows your surgeon\'s more conservative 4-week light duty / 6-week full-strength timeline. <b>Their discharge instructions override everything.</b></div></div>'+

 '<label class="f">Lift cap, weeks 0–4 (lb) <span class="mut">your number, confirm with surgeon</span><input type="number" name="liftCap" value="'+S.liftCap+'"></label>'+

 '<div class="row" style="margin-top:12px"><button class="btn sm" id="exjson">Export backup (JSON)</button><label class="btn sm" style="display:inline-flex;align-items:center">Import backup<input type="file" id="imjson" accept="application/json" style="display:none"></label><button class="btn sm" id="csv2">Export log CSV</button><button class="btn sm danger" id="reset">Reset all data</button></div>'+
 '<div class="banner" style="margin:10px 0 0" id="backupnote"><b>Extra safety copy.</b> Your log also syncs to the cloud backup above. A file backup is a second copy: tap <b>Export backup</b> now and then and keep the file (Files app, iCloud or Drive). <b>Import backup</b> restores it. Last backup: <b>'+(S.lastExport?fmt(dn(S.lastExport)):'never')+'</b>.</div></div>'+

const QS=['Will you use mesh, and is it one side or both (will you check the other side during the robotic repair)?','I believe my lifting limit is 10 lb. Is that right, and exactly how many pounds can I lift in weeks 0–2, 2–4, and 4–6? What are my 4-week "light duty" rules for the gym?','When can I return to assisted dips and pull-ups? (The plan says week 6+, assisted first.) And when can red light therapy and massage go on or near the incisions?','Until Dec 14, is there anything you want me to avoid lifting? Is my plan (machines, no heavy squats/deadlifts, no max lifts) OK?','When can I do stationary bike, incline walking, planks, leg press, and heavy squats/deadlifts again?','My weekly medication: continue, hold, or switch to a liquid diet the day before? (Multisociety guidance on GLP-1-type drugs says most people continue, but anesthesia decides.)','Which of my medications and supplements does anesthesia need to know about, and should any be paused around surgery?','My asthma: should I bring my inhaler and use my controller the morning of surgery? How do I protect the repair when I cough?','Which stool softener or laxative should I take, and starting when?','When can I drive, shower and swim, and go back to work ?','What does normal swelling, bruising, or a seroma look like, versus a call-us-now problem?'];


/* ================= cloud sync (encrypted, textdb.dev) ================= */
const SKEY='hpr-sync';let SY={st:'off',at:null,err:''};let syT=null,syBusy=false,syDirty=false;
function syncCfg(){const h=location.hash.match(/k=([0-9a-f-]{36})\.([A-Za-z0-9_-]{43})/);if(h){localStorage.setItem(SKEY,h[1]+'.'+h[2]);return{id:h[1],key:h[2]}}const v=localStorage.getItem(SKEY);if(v&&/^[0-9a-f-]{36}\.[A-Za-z0-9_-]{43}$/.test(v)){const[a,b]=v.split('.');return{id:a,key:b}}return null}
const b64u=a=>btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
async function ckey(k){return crypto.subtle.importKey('raw',ub64(k),'AES-GCM',false,['encrypt','decrypt'])}
async function enc(obj,k){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await ckey(k),new TextEncoder().encode(JSON.stringify(obj)));return JSON.stringify({v:1,iv:b64u(iv),ct:b64u(ct)})}
async function dec(txt,k){const o=JSON.parse(txt);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},await ckey(k),ub64(o.ct));return JSON.parse(new TextDecoder().decode(pt))}
const SYURL=id=>'https://textdb.dev/api/data/'+id;
function cloudCopy(){const o=JSON.parse(JSON.stringify(S));delete o.sess;return o}
function newer(a,b){return((b&&(b.u||b._u))||0)>((a&&(a.u||a._u))||0)?b:a}
function mergeState(L,R){const M=JSON.parse(JSON.stringify(L));if(!R)return M;
 const key=x=>x.date+'|'+x.ex+'|'+x.set;const m=new Map();(L.log||[]).forEach(x=>m.set(key(x),x));(R.log||[]).forEach(x=>{const k=key(x);m.set(k,m.has(k)?newer(m.get(k),x):x)});M.log=[...m.values()];
 ['checks','food','recov'].forEach(f=>{M[f]=Object.assign({},L[f]||{});Object.entries(R[f]||{}).forEach(([d,v])=>{M[f][d]=M[f][d]?newer(M[f][d],v):v})});
 M.done=Object.assign({},R.done||{},L.done||{});
 if((R._su||0)>(L._su||0)){['surgery','start','repair','liftCap','targets','lastExport','_su','v'].forEach(k=>{if(R[k]!==undefined)M[k]=R[k]})}
 M.sess=L.sess||null;return M}
function setSy(st,err){SY.st=st;SY.err=err||'';if(st==='ok')SY.at=new Date();const el=document.getElementById('syncpill');if(el)el.outerHTML=syncPill();const sb=document.getElementById('syncbox');if(sb&&cur==='timeline')sb.outerHTML=syncBox()}
function syncPill(){const t=SY.at?SY.at.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'';const m={ok:['ok','☁︎ Saved '+t],busy:['blue','☁︎ Saving…'],offline:['warn','☁︎ Offline: on phone, will retry'],off:['bad','☁︎ Cloud sync off'],error:['bad','☁︎ Sync error']}[SY.st]||['','☁︎'];return'<button class="pill '+m[0]+'" id="syncpill" data-go="timeline" style="cursor:pointer;font-family:inherit">'+m[1]+'</button>'}
async function syncNow(){const c=syncCfg();if(!c){setSy('off');return false}if(syBusy){syDirty=true;return false}syBusy=true;syDirty=false;setSy('busy');
 try{const r=await fetch(SYURL(c.id),{cache:'no-store'});if(!r.ok)throw new Error('GET '+r.status);const txt=(await r.text()).trim();
  let R=null;if(txt&&txt.startsWith('{')){R=await dec(txt,c.key)}
  const before=JSON.stringify(cloudCopy());const M=mergeState(S,R);const changed=JSON.stringify(Object.assign({},M,{sess:undefined}))!==JSON.stringify(Object.assign({},S,{sess:undefined}));
  S=M;saveLocal();
  const body=await enc(cloudCopy(),c.key);const w=await fetch(SYURL(c.id),{method:'POST',headers:{'Content-Type':'text/plain'},body});if(!w.ok)throw new Error('POST '+w.status);
  localStorage.setItem('hpr-lastsync',String(Date.now()));syBusy=false;setSy('ok');
  if(changed&&!(cur==='log'&&S.sess)&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)))RENDER[cur]();
  if(syDirty)queueSync(300);return true}
 catch(e){syBusy=false;setSy(navigator.onLine===false||e instanceof TypeError?'offline':'error',String(e&&e.message||e));localStorage.setItem('hpr-dirty','1');return false}}
async function pushOnly(){const c=syncCfg();if(!c)return;try{await fetch(SYURL(c.id),{method:'POST',headers:{'Content-Type':'text/plain'},body:await enc(cloudCopy(),c.key)});setSy('ok')}catch(e){setSy('offline')}}
function queueSync(ms){localStorage.setItem('hpr-dirty','1');clearTimeout(syT);syT=setTimeout(()=>syncNow().then(ok=>{if(ok)localStorage.removeItem('hpr-dirty')}),ms==null?1200:ms)}
function syncBox(){const c=syncCfg();return'<div class="card" id="syncbox"><div class="row sp"><h2 style="margin:0">Cloud backup</h2>'+syncPill()+'</div>'+
 (c?'<div class="note" style="margin-top:6px">Every set, check-in, recovery tick and food entry saves on this phone first, then syncs (encrypted) to your private cloud record, so Chief can read it and your history comes back on any device. Offline? It saves on the phone and syncs when you\'re back online.'+(SY.err?'<br><span class="neg">Last error: '+esc(SY.err)+'</span>':'')+'</div><div class="row" style="margin-top:10px"><button class="btn sm primary" id="syncnow">Sync now</button><button class="btn sm" id="copylink">Copy my private link</button></div><div class="note" style="margin-top:6px">Keep your private link secret: anyone with it can read and change your log. Open it on a new phone to load your history.</div>':
 '<div class="banner" style="margin:8px 0 0">Cloud sync is off on this device. Open your private link (the one Chief sent, ending in <b>#k=…</b>) or paste it here.</div><div class="row"><input id="pastelink" placeholder="Paste private link"><button class="btn sm primary" id="savelink">Connect</button></div>')+'</div>'}

 if(b.dataset.t)return go(b.dataset.t);if(b.dataset.go)return go(b.dataset.go);
 if(b.dataset.rec)return toggleRec(b.dataset.rec);
 if(b.id==='syncnow'){syncNow().then(ok=>toast(ok?'Synced ☁︎':'Sync failed, saved on phone'));return}
 if(b.id==='copylink'){const c=syncCfg();const u=location.origin+location.pathname+'#k='+c.id+'.'+c.key;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Private link copied'),()=>prompt('Copy your private link',u));return}
 if(b.id==='savelink'){const v=($('#pastelink')||{}).value||'';const m=v.match(/k=([0-9a-f-]{36})\.([A-Za-z0-9_-]{43})/);if(!m){toast('That link has no #k= key');return}localStorage.setItem(SKEY,m[1]+'.'+m[2]);syncNow().then(()=>{toast('Connected ☁︎');RENDER[cur]()});return}
 if(b.dataset.start)return startSession(b.dataset.start,b.dataset.date);
 if(b.dataset.d){progDay=b.dataset.d;return renderProgram()}
 if(b.dataset.v){progRef=+b.dataset.v;progDay=dowOf(progRef)==='SUN'?'MON':dowOf(progRef);return renderProgram()}

  if(sym){const c=S.checks[d]||{};c._u=Date.now();if(sym===1)c.bulge=Math.max(+c.bulge||0,1);if(sym>=2)c.pain=Math.max(+c.pain||0,sym===2?3:5);S.checks[d]=c}

 if(b.id==='discard'){S.sess=null;save();return renderLog()}
 if(b.id==='csv'||b.id==='csv2')return csv();
 if(b.id==='exjson'){S.lastExport=todayStr();S._su=Date.now();save();return dl('hernia-dashboard-backup-'+todayStr()+'.json',JSON.stringify(S,null,1),'application/json')}
 if(b.id==='reset'){if(confirm('Erase ALL data on this phone AND in the cloud backup? This cannot be undone.')){localStorage.removeItem(KEY);S=load();S._su=Date.now();saveLocal();pushOnly().then(()=>toast('All data erased'));go('home')}}
});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,fd=new FormData(f);

});
document.addEventListener('change',e=>{if(e.target.id==='imjson'){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);S=Object.assign({},DEF,o,{targets:Object.assign({},DEF.targets,o.targets||{})});save();toast('Backup imported');go('home')}catch(x){toast('Not a valid backup')}};r.readAsText(e.target.files[0])}});
go('home');setSy(syncCfg()?'busy':'off');syncNow();
window.addEventListener('online',()=>syncNow());document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});setInterval(()=>{if(localStorage.getItem('hpr-dirty'))syncNow().then(ok=>{if(ok)localStorage.removeItem('hpr-dirty')})},60000);
